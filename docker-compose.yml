version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: core_studio_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-core_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-core_pass}
      POSTGRES_DB: ${POSTGRES_DB:-core_studio}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_user -d core_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: core_studio_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: core_studio_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-core_user}:${POSTGRES_PASSWORD:-core_pass}@postgres:5432/${POSTGRES_DB:-core_studio}
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FIGMA_API_KEY: ${FIGMA_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./packages/backend:/app
      - ./knowledge:/app/knowledge
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: core_studio_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-core_user}:${POSTGRES_PASSWORD:-core_pass}@postgres:5432/${POSTGRES_DB:-core_studio}
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./packages/backend:/app
      - ./knowledge:/app/knowledge
      - uploads_data:/app/uploads
    depends_on:
      - backend
      - redis
    command: celery -A app.worker worker --loglevel=info --concurrency=4

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: core_studio_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
