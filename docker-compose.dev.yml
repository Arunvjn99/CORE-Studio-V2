version: "3.9"

# ── CORE Studio V2 — Dev Docker (mirrors server_local.py exactly) ─────────────
# Uses SQLite + ChromaDB, no PostgreSQL or Redis needed.
# Identical behaviour to: make dev-local
# Usage: make dev-docker

services:
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile.dev
    container_name: core_studio_backend_dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      AI_BACKEND_MODE: ${AI_BACKEND_MODE:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_FAST: ${ANTHROPIC_FAST:-claude-haiku-4-5-20251001}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_ADVANCED: ${ANTHROPIC_ADVANCED:-claude-opus-4-8}
      JWT_SECRET: ${JWT_SECRET:-core-studio-local-dev-secret}
      UPLOADS_DIR: ./uploads
    volumes:
      - ./packages/backend:/app
      - ./knowledge:/knowledge
      - backend_uploads:/app/uploads
      - backend_chroma:/app/.chroma_db
      - backend_chroma_cache:/root/.cache/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 300s

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile.dev
    container_name: core_studio_frontend_dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    volumes:
      - ./packages/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_chroma:
  backend_chroma_cache:
  frontend_node_modules:
  frontend_next:
